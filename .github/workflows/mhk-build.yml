
name: Build MHK AI Toyota S222

on:
  workflow_dispatch:
  push:
    paths:
      - 'MHK-AI-Toyota-S222-1.0.11-source.zip'
      - '.github/workflows/mhk-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          mkdir -p /tmp/mhk
          unzip -q MHK-AI-Toyota-S222-1.0.11-source.zip -d /tmp/mhk
          PROJECT_DIR=$(find /tmp/mhk -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          rsync -a --exclude='.git/' "$PROJECT_DIR"/ ./
          chmod +x gradlew
          find app/src/main/java -type f -name '*.kt' -exec sed -i 's#com\.kangrio\.byd\.assistant\.R#com.mhk.ai.assistant.R#g' {} +
          # Fix manifest class names: Kotlin classes remain in the original package.
          sed -i \
            -e 's#android:name=".App"#android:name="com.kangrio.byd.assistant.App"#' \
            -e 's#android:name=".StartActivity"#android:name="com.kangrio.byd.assistant.StartActivity"#' \
            -e 's#android:name=".activity.SettingsActivity"#android:name="com.kangrio.byd.assistant.activity.SettingsActivity"#' \
            -e 's#android:name=".activity.PermissionOnboardingActivity"#android:name="com.kangrio.byd.assistant.activity.PermissionOnboardingActivity"#' \
            -e 's#android:name=".activity.LogcatActivity"#android:name="com.kangrio.byd.assistant.activity.LogcatActivity"#' \
            -e 's#android:name=".receiver.BootReceiver"#android:name="com.kangrio.byd.assistant.receiver.BootReceiver"#' \
            -e 's#android:name=".service.VoiceWakeService"#android:name="com.kangrio.byd.assistant.service.VoiceWakeService"#' \
            -e 's#android:name=".service.ButtonTriggerService"#android:name="com.kangrio.byd.assistant.service.ButtonTriggerService"#' \
            app/src/main/AndroidManifest.xml


      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MHK-AI-Toyota-S222
          path: app/build/outputs/apk/debug/*.apk
