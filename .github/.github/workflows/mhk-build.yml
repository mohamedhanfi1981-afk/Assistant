
name: Build MHK AI Toyota S222

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'androidwakeword/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/mhk-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare MHK AI source
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          chmod +x gradlew

          find app/src/main/java -type f -name '*.kt' \
            -exec sed -i \
            's#com\.kangrio\.byd\.assistant\.R#com.mhk.ai.assistant.R#g' {} +

          sed -i \
            -e 's#android:name=".App"#android:name="com.kangrio.byd.assistant.App"#' \
            -e 's#android:name=".StartActivity"#android:name="com.kangrio.byd.assistant.StartActivity"#' \
            -e 's#android:name=".activity.SettingsActivity"#android:name="com.kangrio.byd.assistant.activity.SettingsActivity"#' \
            -e 's#android:name=".activity.PermissionOnboardingActivity"#android:name="com.kangrio.byd.assistant.activity.PermissionOnboardingActivity"#' \
            -e 's#android:name=".activity.LogcatActivity"#android:name="com.kangrio.byd.assistant.activity.LogcatActivity"#' \
            -e 's#android:name=".receiver.BootReceiver"#android:name="com.kangrio.byd.assistant.receiver.BootReceiver"#' \
            -e 's#android:name=".service.VoiceWakeService"#android:name="com.kangrio.byd.assistant.service.VoiceWakeService"#' \
            -e 's#android:name=".service.ButtonTriggerService"#android:name="com.kangrio.byd.assistant.service.ButtonTriggerService"#' \
            app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MHK-AI-Toyota-S222-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
